<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>KOBE in Your Pocket</title>
<style>
  :root { color-scheme: light dark; --fg: #1a1a1a; --muted: #5a5f66; --bg: #ffffff; --line: #e2e4e8; --accent: #C67B4A; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #e8e8e8; --muted: #a0a5ad; --bg: #16181c; --line: #2c2f35; }
  }
  body { margin: 0; padding: 4rem 1.25rem; background: var(--bg); color: var(--fg);
         font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
         line-height: 1.8; }
  main { max-width: 34rem; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin: 0 0 0.5rem; }
  p.lead { color: var(--muted); margin: 0 0 2.5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin-bottom: 0.75rem; }
  a.card { display: block; padding: 0.9rem 1.1rem; border: 1px solid var(--line); border-radius: 8px;
           text-decoration: none; color: var(--fg); }
  a.card:hover { border-color: var(--accent); }
  a.card .lang { color: var(--muted); font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>KOBE in Your Pocket</h1>
  <p class="lead">Legal documents for the KOBE in Your Pocket mobile app.</p>
  <ul>
    <li><a class="card" href="./privacy/">Privacy Policy <span class="lang">— English</span></a></li>
    <li><a class="card" href="./privacy/ja/">プライバシーポリシー <span class="lang">— 日本語</span></a></li>
    <li><a class="card" href="./privacy/ko/">Privacy Policy <span class="lang">— 한국어</span></a></li>
    <li><a class="card" href="./privacy/zh/">Privacy Policy <span class="lang">— 中文</span></a></li>
  </ul>
</main>
</body>
</html>
